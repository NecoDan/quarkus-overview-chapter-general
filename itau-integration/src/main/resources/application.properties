quarkus.hibernate-orm.itau.datasource=itau
quarkus.hibernate-orm.itau.packages=br.com.daniel.java.quarkus.general.adapter.out.entities.itau
quarkus.hibernate-orm.itau.schema-management.strategy=update
quarkus.hibernate-orm.itau.log.sql=true

quarkus.datasource.itau.db-kind=postgresql
quarkus.datasource.itau.devservices.enabled=false
quarkus.datasource.itau.jdbc.url=${ITAU_DB_URL:jdbc:postgresql://localhost:5432/envlocaldb}
quarkus.datasource.itau.username=${ITAU_DB_USERNAME:postgres}
quarkus.datasource.itau.password=${ITAU_DB_PASSWORD:}
quarkus.datasource.itau.jdbc.min-size=5
quarkus.datasource.itau.jdbc.max-size=20
quarkus.datasource.itau.jdbc.acquisition-timeout=30S
