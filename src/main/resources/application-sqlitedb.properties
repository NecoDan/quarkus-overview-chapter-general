##################################################################################################################
quarkus.log.level=INFO

##################################################################################################################
# Config JPA - Preserve existing data when the application restarts
quarkus.hibernate-orm.schema-management.strategy=update

##################################################################################################################
# -- Database SQLite (file created in the project root by default)
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=${SQLITE_JDBC_URL:jdbc:sqlite:quarkus-general.db}
quarkus.datasource.username=
quarkus.datasource.password=
quarkus.hibernate-orm.log.sql=true

# SQLite accepts a single writer; a single pooled connection avoids lock contention.
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.datasource.devservices.enabled=false