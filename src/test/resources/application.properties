##################################################################################################################
quarkus.log.level=INFO
quarkus.http.test-port=0

##################################################################################################################
# -- Database H2 Memory Configs:
# ==========================================
# Default / Production Configuration
# ==========================================
# 1. Primary Relational DB (H2)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.log.sql=true

# -----> default connection pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30S

# Config JPA - Ignore Database & Hibernate DDL Auto
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

##################################################################################################################
# -- Database MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27017/db_btgpactualtest?retryWrites=false
quarkus.mongodb.database=db_btgpactualtest

# Credenciiais
quarkus.mongodb.credentials.username=
quarkus.mongodb.credentials.password=admintest123
quarkus.mongodb.credentials.auth-source=

# Habilita a cria��o autom�tica dos �ndices anotados com @Indexed e @CompositeIndex
quarkus.mongodb.panache.create-indexes=true

# Op��o B: Salvar como String/Texto (Recomendado para legibilidade visual nas consultas)
quarkus.mongodb.uuid-representation=c_sharp_legacy

## Turn off Dev Services container auto-start
#quarkus.mongodb.devservices.enabled=false
#
## Connect directly to your existing MongoDB instance
#quarkus.mongodb.connection-string=mongodb://localhost:27018

##################################################################################################################
# ==========================================
# Test Profile Overrides (%test%)
# ==========================================
# The integration environment provides MongoDB; do not start a second container.
quarkus.mongodb.devservices.enabled=false

# Disable health check for MongoDB so test readiness checks pass without Mongo
quarkus.mongodb.health.enabled=false

# Point H2 in test to an isolated in-memory DB
%test%.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Use the in-memory connector in integration tests so the RabbitMQ channel is
# exercised without requiring a broker during the Maven test phase.
%test.mp.messaging.incoming.btg-pactual-orderbtgpactual-created-in.connector=smallrye-in-memory
