services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quarkus-overview-chapter-general:local
    ports:
      - "8095:8095"
    environment:
      QUARKUS_PROFILE: btg
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8095
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://admin:admin@mongodb:27017/db_btgpactual?authSource=admin&retryWrites=false
      QUARKUS_MONGODB_DATABASE: db_btgpactual
      QUARKUS_MONGODB_CREDENTIALS_USERNAME: admin
      QUARKUS_MONGODB_CREDENTIALS_PASSWORD: admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: db_btgpactual
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongodb-data:
  rabbitmq-data:
