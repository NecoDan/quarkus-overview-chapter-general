##################################################################################################################
# ----> Default Port
quarkus.http.port=8095

##################################################################################################################
# ----> Profile Defintion
quarkus.profile=itau
#quarkus.profile=sqlitedb
#quarkus.profile=h2db

##################################################################################################################
quarkus.application.name=API-QUARKUS-GENERAL
quarkus.log.console.json.additional-field."microservice".value=apiquarkusgeneral
quarkus.log.console.json.additional-field."microservice".type=string
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*

# ----> Keep the API documentation available in packaged/production builds.
quarkus.swagger-ui.always-include=true

##################################################################################################################
# ----> Default configuration CredentialProvider
apiquarkusgeneral.application.log-complete=true
apiquarkusgeneral.application.flag-type-service-consumer=1

##################################################################################################################
shorten.url.daystoexpire.value=1

##################################################################################################################
# ----> Configuration hibernate ORM
quarkus.hibernate-orm.packages=br.com.daniel.java.quarkus.general.adapter.out.entities.general,\
  br.com.daniel.java.quarkus.general.adapter.out.entities.uol,\
  br.com.daniel.java.quarkus.general.adapter.out.entities.shorten_url

quarkus.hibernate-orm.itau.datasource=itau
quarkus.hibernate-orm.itau.packages=br.com.daniel.java.quarkus.general.adapter.out.entities.itau
quarkus.hibernate-orm.itau.schema-management.strategy=update

##################################################################################################################
# ----> URLS Externas
uol.herogroup.marvel-or-dc-comics.service.url=https://raw.githubusercontent.com/uolhost
