##################################################################################################################
quarkus.log.level=INFO

##################################################################################################################
# Config JPA - Ignore Database & Hibernate DDL Auto
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.flyway.migrate-at-start=true

##################################################################################################################
# -- Database MySQL
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/envlocaldb
quarkus.datasource.username=dbmysql
quarkus.datasource.password=${DB_PASSWORD_KEY:dbmysql123}
quarkus.hibernate-orm.log.sql=true

# -----> default connection pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30S

# Itaú integration uses a separate PostgreSQL datasource.
quarkus.datasource.itau.db-kind=postgresql
quarkus.datasource.itau.devservices.enabled=false
quarkus.datasource.itau.jdbc.url=${ITAU_DB_URL:jdbc:postgresql://localhost:5432/envlocaldb}
quarkus.datasource.itau.username=${ITAU_DB_USERNAME:postgres}
quarkus.datasource.itau.password=${ITAU_DB_PASSWORD:}
quarkus.datasource.itau.jdbc.min-size=5
quarkus.datasource.itau.jdbc.max-size=20
quarkus.datasource.itau.jdbc.acquisition-timeout=30S
quarkus.hibernate-orm.itau.log.sql=true

##################################################################################################################