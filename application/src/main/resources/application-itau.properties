quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${ITAU_DB_URL:jdbc:mysql://localhost:3306/envlocaldb}
quarkus.datasource.username=${ITAU_DB_USERNAME:dbmysql}
quarkus.datasource.password=${ITAU_DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update
