##################################################################################################################
quarkus.log.level=INFO

##################################################################################################################
# -- Database H2 Memory Configs:
# ==========================================
# Default / Production Configuration
# ==========================================
# 1. Primary Relational DB (H2)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.log.sql=true

# -----> default connection pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30S

# Config JPA - Ignore Database & Hibernate DDL Auto
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Disable MongoDB Dev Services for this profile - If running standard local MongoDB (port 27017)
quarkus.mongodb.connection-string=mongodb://localhost:27017/mydb
%customh2db.quarkus.mongodb.devservices.enabled=false
%customh2db.quarkus.mongodb.health.enabled=false

quarkus.mongodb.credentials.username=admin
quarkus.mongodb.credentials.password=admin
quarkus.mongodb.credentials.auth-source=admin


